---
  - name: "Full Automation: Install Docker & Deploy App"
    hosts: my_computer
    become: true 
  
    vars:
      docker_id: "larkracl" # [수정] 본인 ID
      image_name: "mini-app" # 본인이 docker hub에 올린 이미지의 이름과 같게 만들기
      container_name: "my-running-app"
  
    tasks:
      # ---------------------------------------------------
      # 1. 도커 설치를 위한 준비물 (보안키, 저장소 주소 등)
      # ---------------------------------------------------
      - name: "1. Setup Docker Repository"
        block:
          - name: Install dependencies
            apt:
              name: [ca-certificates, curl, gnupg, python3-pip]
              state: present
              update_cache: yes
  
          - name: Add Docker GPG key
            apt_key:
              url: https://download.docker.com/linux/ubuntu/gpg
              state: present
  
          - name: Add Docker Repository URL
            apt_repository:
              # "우분투용 도커를 다운받겠다"는 주소 등록일 뿐, OS 설치 아님!
              repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
              state: present
  
      # ---------------------------------------------------
      # 2. 도커 엔진 & 연결 모듈 설치
      # ---------------------------------------------------
      - name: "2. Install Docker Engine & Python SDK"
        block:
          - name: Install Docker Packages
            apt:
              name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin]
              state: present
              update_cache: yes
  
          - name: Start Docker Service
            service:
              name: docker
              state: started
              enabled: yes
  
          - name: Install Python Docker Module (Required for Ansible)
            pip:
              name: docker
              state: present
              extra_args: "--break-system-packages"
            ignore_errors: yes
  
      # ---------------------------------------------------
      # 3. 앱 배포 (이미지 다운로드 -> 컨테이너 실행)
      # ---------------------------------------------------
      - name: "3. Deploy Web Application"
        block:
          - name: Pull Image
            docker_image:
              name: "{{ docker_id }}/{{ image_name }}"
              tag: latest
              source: pull
              force_source: yes
  
          - name: Remove Old Container
            docker_container:
              name: "{{ container_name }}"
              state: absent
              force_kill: yes
  
          - name: Run New Container
            docker_container:
              name: "{{ container_name }}"
              image: "{{ docker_id }}/{{ image_name }}:latest"
              state: started
              restart_policy: always
              ports:
                - "8080:8080"