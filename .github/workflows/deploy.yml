name: "CI/CD Pipeline (Build: GitHub / Deploy: Monitoring Runner)"

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
 # [JOB 1] 빌드 및 푸시: GitHub 서버(ubuntu-latest) 리소스 사용
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/mini-app:latest mini-app/
          docker push ${{ secrets.DOCKER_USERNAME }}/mini-app:latest

  # [JOB 2] 배포: 우리 Monitoring EC2(self-hosted) 리소스 사용
  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create SSH Key file
        run: |
          echo "${{ secrets.AWS_SSH_KEY }}" > ktcloud-key.pem
          chmod 400 ktcloud-key.pem

      - name: Run Ansible Playbook
        run: |
          ansible-playbook deploy_app.yml
