---
- name: "Bootstrap: Setup GitHub Runner on Monitoring EC2"
  hosts: bastion
  become: no

  vars:
    # [수정 필요] 1. 본인의 GitHub PAT (Personal Access Token) (github_pat.key에 저장)
    github_pat: "{{ lookup('file', './github_pat.key') | trim }}"
    # [수정 필요] 2. 레포지토리 정보 (이후 레포지토리가 바뀌면 수정 불가피)
    repo_owner: "ktcloudmini"
    repo_name: "platform"
    
    runner_dir: "/home/ubuntu/actions-runner"
    runner_version: "2.311.0"

  tasks:
    # 1. 깃허브 API를 통해 실시간 등록 토큰 가져오기
    - name: Get GitHub Runner Registration Token from API
      uri:
        url: "https://api.github.com/repos/{{ repo_owner }}/{{ repo_name }}/actions/runners/registration-token"
        method: POST
        headers:
          Authorization: "token {{ github_pat }}"
          Accept: "application/vnd.github+json"
        status_code: 201
      register: token_response
      delegate_to: localhost  # 토큰 요청은 내 컴퓨터(로컬)에서 수행

    # 2. 러너 설치 폴더 생성
    - name: Create directory for GitHub Runner
      file:
        path: "{{ runner_dir }}"
        state: directory
        mode: '0755'

    # 3. 러너 패키지 다운로드 및 압축 해제
    - name: Download and Unarchive GitHub Runner
      unarchive:
        src: "https://github.com/actions/runner/releases/download/v{{ runner_version }}/actions-runner-linux-x64-{{ runner_version }}.tar.gz"
        dest: "{{ runner_dir }}"
        remote_src: yes

    # 4. 러너 등록 (이미 등록되어 있으면 건너뜀)
    - name: Configure GitHub Runner
      command: >
        ./config.sh --url https://github.com/{{ repo_owner }}/{{ repo_name }}
        --token {{ token_response.json.token }}
        --unattended --replace --name "Monitoring-Runner"
      args:
        chdir: "{{ runner_dir }}"
        creates: "{{ runner_dir }}/.runner"

    # 5. 서비스 등록 및 시작 (백그라운드 실행을 위해 중요!)
    - name: Install Runner Service
      become: yes  # 서비스 등록은 root 권한 필요
      command: "./svc.sh install ubuntu"
      args:
        chdir: "{{ runner_dir }}"
      ignore_errors: yes

    - name: Start Runner Service
      become: yes
      command: "./svc.sh start"
      args:
        chdir: "{{ runner_dir }}"
      ignore_errors: yes
